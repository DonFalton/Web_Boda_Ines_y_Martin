services:
  mysql:
    image: ${TEST_DATABASE_IMAGE:-mysql:8.0}
    environment:
      MYSQL_ROOT_PASSWORD: local-test-root-only
      MYSQL_DATABASE: album_php_test
      MYSQL_USER: album_php_test
      MYSQL_PASSWORD: local-test-app-only
      MARIADB_ROOT_PASSWORD: local-test-root-only
      MARIADB_DATABASE: album_php_test
      MARIADB_USER: album_php_test
      MARIADB_PASSWORD: local-test-app-only
    healthcheck:
      test: ["CMD-SHELL", "if command -v mysqladmin >/dev/null 2>&1; then mysqladmin ping -h 127.0.0.1 -uroot -plocal-test-root-only; else mariadb-admin ping -h 127.0.0.1 -uroot -plocal-test-root-only; fi"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/mysql

  php-test:
    build:
      context: ..
      dockerfile: hostinger-php/Dockerfile
    environment:
      TEST_MYSQL_HOST: mysql
      TEST_MYSQL_PORT: "3306"
      TEST_MYSQL_DATABASE: album_php_test
      TEST_MYSQL_USER: album_php_test
      TEST_MYSQL_PASSWORD: local-test-app-only
    depends_on:
      mysql:
        condition: service_healthy
    command:
      - sh
      - -c
      - find hostinger-php -name '*.php' -print0 | xargs -0 -n1 php -l && php hostinger-php/tests/run.php
